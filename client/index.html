<html lang="ja"><head><meta charset="utf-8">

<style>
:root{--bg:#0b0a1a;--ink:#f4f1ff;--runner:#27e6ff;--hunter:#ff3b7a;--gold:#ffd23f}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}

canvas{display:block;position:fixed;inset:0}

#title{background:radial-gradient(circle at 50% 35%,#2a1050,var(--bg) 70%)}

.sub{opacity:.8;margin:8px 0 28px;font-family:"Noto Sans JP"}
button{font:800 18px Rubik,"Noto Sans JP";color:var(--bg);background:var(--runner);border:0;border-radius:14px;padding:14px 30px;margin:6px;box-shadow:0 0 22px #27e6ff88;cursor:pointer}

#evt.show{animation:pop 1.8s ease-out}

.cr label{display:block;margin:8px;font-weight:700}.cr input{width:120px;padding:2px;margin:4px;vertical-align:middle}#bc{bottom:max(150px,env(safe-area-inset-bottom));right:100px;background:#a86bff;color:#fff}#mapbtns button{display:block;margin:8px auto;min-width:240px}@media(orientation:portrait){.tb{width:56px;height:56px;font-size:11px}#bc{right:84px}#bd{right:84px}}
</style></head><body>
<div id="title" class="ov on"><h1>CHASE!</h1><p class="sub">3分間の3D鬼ごっこ ・ 捕まったら、君も鬼。</p>
<input id="name" maxlength="8" placeholder="なまえ" value="PLAYER"><br><button id="bTag">TAG</button><button class="alt" id="bHs">HIDE &amp; SEEK</button><br><button id="bChr" style="background:#a86bff;color:#fff;box-shadow:0 0 22px #a86bff88">CHARACTER</button>
<p class="sub" style="font-size:13px">PC: WASD 移動 / マウス 視点 / Shift ダッシュ / Space ジャンプ / クリック/F チェスト・使用 / C 視点切替<br>スマホ: 左スティック 移動 / 右スワイプ 視点</p></div>
<div id="maps" class="ov"><h2 style="margin:0 0 14px">MAP SELECT</h2><div id="mapbtns"></div><button class="alt" id="mback">BACK</button></div>
<div id="chr" class="ov"><h2 style="margin:0 0 14px">CHARACTER</h2><div class="cr"><label>髪色 <input type="color" id="cHair"></label><label>肌 <input type="color" id="cSkin"></label><label>スカート <input type="color" id="cSkirt"></label><label>身長 <input type="range" id="cH" min="0.9" max="1.1" step="0.01"></label><label><input type="checkbox" id="cT"> ツインテール</label></div><button id="cok">SAVE</button></div>

<div id="hud"><div id="top"><div class="chip" id="role"></div><div id="time">3:00</div><div class="chip" id="nums"></div></div>
<div id="arrow">▲</div><div id="evt"></div><div class="chip" id="item" style="color:var(--gold);display:none"></div><div id="stam"><i></i></div></div>
<div id="touch"><div id="stick"><div id="knob"></div></div><button class="tb" id="bj">JUMP</button><button class="tb" id="bd">DASH</button><button class="tb" id="bi">USE</button><button class="tb" id="bc">CAM</button></div>
<div id="res" class="ov"><h2 id="rt"></h2><p class="sub" id="rs"></p><button id="again">REMATCH</button><button class="alt" id="menu">MENU</button></div>
<script>
// ===== GAME CORE（サーバー移植用：描画・DOMに依存しない。C言語サーバーへ同じ構造で移せる） =====
const C={ARENA:30,TIME:180,RUN:6.2,HUNT:6.6,DASH:1.6,CATCH:1.15,N:6};
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function makeMap(seed){const r=rng(seed),b=[];
 for(let i=0;i<26;i++){const w=3+r()*5,d=3+r()*5,low=r()<.3,x=(r()-.5)*50,z=(r()-.5)*50;
  if(Math.hypot(x,z)<7)continue;b.push({x,z,w,d,h:low?.8:4+r()*8,low});}
 return b}
class Game{
 constructor(names,seed,mode){this.map=makeMap(seed);this.t=C.TIME;this.over=null;this.events={};this.items=[];this.decoys=[];this.mode=mode;this.hs=mode=='HS';this.hideT=this.hs?30:0;this.spawnT=3;this.ar=C.ARENA;this.spd=1;this.regen=1;this.night=false;this.ev=null;
  this.P=names.map((n,i)=>({id:i,name:n,bot:i>0,hunter:false,x:Math.cos(i*1.05)*14,z:Math.sin(i*1.05)*14,y:0,vy:0,yaw:0,st:1,shield:0,hide:0,boost:0,dashT:0,jumpB:0,item:null,stun:0,grace:0,goal:null,gt:0,in:{x:0,z:0,dash:false}}));
  this.P[Math.floor(Math.random()*this.P.length)].hunter=true}
 hide(){return 0}
 collide(p){for(const b of this.map.concat([])){
   if(p.y>b.h-.1&&b.low)continue;const hx=b.w/2+.45,hz=b.d/2+.45,dx=p.x-b.x,dz=p.z-b.z;
   if(Math.abs(dx)<hx&&Math.abs(dz)<hz){const px=hx-Math.abs(dx),pz=hz-Math.abs(dz);if(px<pz)p.x+=Math.sign(dx||1)*px;else p.z+=Math.sign(dz||1)*pz}}
  const d=Math.hypot(p.x,p.z);if(d>this.ar-.5){p.x*=(this.ar-.5)/d;p.z*=(this.ar-.5)/d}}
 step(dt){if(this.over)return;this.t-=dt;this.timeline();this.decoys=this.decoys.filter(d=>(d.t-=dt)>0);if(this.hideT>0){this.hideT-=dt;if(this.hideT<=0)this.ev={n:'SEEKER GO!'}}
  for(const p of this.P){if(p.bot)this.ai(p,dt);if(this.hs&&(p.found||(p.hunter&&this.hideT>0)))p.in.x=p.in.z=0;
   const m=Math.hypot(p.in.x,p.in.z);let vx=0,vz=0;
   if(m>.05&&p.stun<=0){const base=(p.hunter?C.HUNT:C.RUN)*this.spd*(p.boost>0?1.5:1);
    let dash=(p.in.dash&&p.st>0.02)||p.dashT>0;if(dash){p.st-=dt*.45;base*0}
    const s=base*(dash?C.DASH:1)*Math.min(1,m);p.st=Math.min(1,p.st+(dash?0:dt*.2*this.regen));
    vx=p.in.x/m*s;vz=p.in.z/m*s;p.yaw=Math.atan2(vx,vz)}else p.st=Math.min(1,p.st+dt*.25*this.regen);
   p.x+=vx*dt;p.z+=vz*dt;p.vy-=24*dt;p.y+=p.vy*dt;if(p.y<0){p.y=0;p.vy=0}
   for(const k of['stun','boost','hide','dashT','grace','jumpB'])if(p[k]>0)p[k]-=dt;
   this.collide(p);
   if(p.item==null||!p.bot&&false){}
   if(p.bot)for(const it of this.items){if(it.dead||p.item||p.found||Math.hypot(it.x-p.x,it.z-p.z)>1.4)continue;this.open(p,it)}}
  this.items=this.items.filter(i=>!i.dead);
  this.spawnT-=dt;if(this.spawnT<=0){this.spawnT=(this.t<135?2.2:3.5)/(this.t<30?1.6:1);if(this.items.length<10)this.spawnItem()}
  for(const h of this.P)if(h.hunter&&h.stun<=0&&h.grace<=0&&!(this.hs&&this.hideT>0))for(const r of this.P){
   if(r.hunter||r.found||Math.hypot(h.x-r.x,h.z-r.z)>(this.hs?C.CATCH*1.4:C.CATCH)||Math.abs(h.y-r.y)>1.4)continue;
   if(r.shield>0){r.shield=0;h.stun=1.2;this.ev={n:'SHIELD!',id:r.id};continue}
   if(this.hs){r.found=1;r.item=null;this.ev={n:'FOUND',id:r.id}}else{r.hunter=true;r.grace=1.5;r.item=null;r.shield=0;r.boost=0;this.ev={n:'CAUGHT',id:r.id}}}
  if(this.P.every(p=>p.hunter||p.found))this.over=this.hs?'SEEKERS':'HUNTERS';else if(this.t<=0){this.t=0;this.over=this.hs?'HIDERS':'RUNNERS'}}
 timeline(){if(this.hs)return;const f=(k,c)=>{if(!this.events[k]&&c){this.events[k]=1;return true}};
  if(f('s',this.t<=135)){this.spd=1.12;this.ev={n:'SPEED UP'}}
  if(f('n',this.t<=90)){this.night=true;this.ev={n:'NIGHT'}}
  if(f('a',this.t<=75)){this.ev={n:'AREA SHRINK'}}
  if(this.t<=75&&this.t>30)this.ar=C.ARENA-(75-this.t)/45*10;
  if(f('c',this.t<=30)){this.spd=1.25;this.regen=2.5;this.ev={n:'CHAOS TIME'}}
  if(this.t<=30){this.cT=(this.cT||0)-1/60;if(this.cT<=0){this.cT=4;const b=this.map[Math.floor(Math.random()*this.map.length)];if(b&&b.h<3&&Math.hypot(b.x,b.z)>6){b.x=(Math.random()-.5)*40;b.z=(Math.random()-.5)*40;this.moved=1}}}}
 spawnItem(){for(let k=0;k<12;k++){const a=Math.random()*6.28,d=Math.random()*(this.ar-3),x=Math.cos(a)*d,z=Math.sin(a)*d;if(this.map.some(b=>Math.abs(x-b.x)<b.w/2+1.2&&Math.abs(z-b.z)<b.d/2+1.2))continue;this.items.push({x,z});return}}
 use(p){if(!p.item)return;const t=p.item;p.item=null;
  if(t=='SPEED')p.boost=5;if(t=='SHIELD')p.shield=8;if(t=='HIDE')p.hide=4;if(t=='JUMP'){p.vy=14}
  if(t=='DASH')p.dashT=2;if(t=='RADAR')p.radar=6;if(t=='SCAN')p.radar=14;if(t=='DECOY'){const a=Math.random()*6.28;this.decoys.push({x:Math.cos(a)*18,z:Math.sin(a)*18,hide:0,hunter:false,t:12})}}
 ai(p,dt){p.gt-=dt;if(this.hs&&!p.hunter){const h=this.P.find(o=>o.hunter);if(!p.spot){const b=this.map[Math.random()*this.map.length|0],cd=Math.hypot(b.x,b.z)||1;p.spot={x:b.x+b.x/cd*(b.w/2+1.2),z:b.z+b.z/cd*(b.d/2+1.2)}}const dx=p.spot.x-p.x,dz=p.spot.z-p.z,sd=Math.hypot(h.x-p.x,h.z-p.z);if(this.hideT<=0&&sd<7){this.aim(p,p.x-h.x,p.z-h.z);p.in.dash=p.st>.3;p.spot=null}else if(Math.hypot(dx,dz)>1){this.aim(p,dx,dz);p.in.dash=false;this.unstick(p,dt)}else{p.in.x=p.in.z=0}return}const others=this.P.filter(o=>o!==p&&o.hunter!==p.hunter&&!(o.hide>0&&p.hunter));
  if(p.hunter){if(this.hs){const nr=this.P.find(o=>!o.hunter&&!o.found&&o.hide<=0&&Math.hypot(o.x-p.x,o.z-p.z)<14);if(nr){this.aim(p,nr.x-p.x,nr.z-p.z);p.in.dash=false}else{if(!p.wp||p.gt<=0||Math.hypot(p.wp.x-p.x,p.wp.z-p.z)<2){p.wp={x:(Math.random()-.5)*50,z:(Math.random()-.5)*50};p.gt=5}this.aim(p,p.wp.x-p.x,p.wp.z-p.z);this.unstick(p,dt)}return}const rs=this.P.filter(o=>!o.hunter&&o.hide<=0&&o.shield<=0).concat(this.P.filter(o=>!o.hunter&&o.hide<=0));
   if(p.gt<=0){p.gt=1.2+Math.random()*2;p.goal=rs.sort((a,b)=>Math.hypot(a.x-p.x,a.z-p.z)-Math.hypot(b.x-p.x,b.z-p.z))[Math.random()<.2?Math.min(1,rs.length-1):0]}
   const g=p.goal;if(g&&!g.hunter){this.aim(p,g.x-p.x+(Math.random()-.5),g.z-p.z);p.in.dash=Math.hypot(g.x-p.x,g.z-p.z)<9&&p.st>.4}else{p.in.x=p.in.z=0}}
  else{const hs=this.P.filter(o=>o.hunter);let n=null,nd=1e9;for(const h of hs){const d=Math.hypot(h.x-p.x,h.z-p.z);if(d<nd){nd=d;n=h}}
   if(!n){p.in.x=p.in.z=0;return}
   let dx=p.x-n.x,dz=p.z-n.z;const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;
   const it=this.items.find(i=>!i.forHunter&&!p.item&&Math.hypot(i.x-p.x,i.z-p.z)<12);
   if(nd>11&&it){dx=it.x-p.x;dz=it.z-p.z}else{const cd=Math.hypot(p.x,p.z);if(cd>this.ar-5){dx-=p.x/cd*1.4;dz-=p.z/cd*1.4}
    if(p.gt<=0){p.gt=.8;p.side=Math.random()<.5?1:-1}const s=(p.side||1)*.6;const tx=dx-dz*s,tz=dz+dx*s;dx=tx;dz=tz}
   this.aim(p,dx,dz);p.in.dash=nd<6&&p.st>.3;if(nd<4&&p.item&&Math.random()<.05)this.use(p);
   if(p.stuck>0.5&&p.y==0){p.vy=9}}
  const px=p.lx,pz=p.lz;p.stuck=(px!=null&&Math.hypot(p.x-px,p.z-pz)<.01&&(p.in.x||p.in.z))?(p.stuck||0)+dt:0;p.lx=p.x;p.lz=p.z;
  if(p.stuck>.4){p.in.x=-p.in.z;p.in.z=p.in.x}}
 aim(p,dx,dz){const l=Math.hypot(dx,dz)||1;p.in.x=dx/l;p.in.z=dz/l}
 unstick(p,dt){const mv=Math.hypot(p.x-(p.lx??p.x),p.z-(p.lz??p.z));p.lx=p.x;p.lz=p.z;p.sk=mv<.004?(p.sk||0)+dt:0;if(p.sk>.5){p.wp=null;p.spot=null;p.sk=0;p.gt=0}}
 roll(p){const t=this.hs?(p.hunter?['RADAR','SCAN','DASH']:['HIDE','DECOY','SPEED']):(p.hunter?['DASH','RADAR']:['SPEED','SHIELD','HIDE','JUMP']);return t[Math.random()*t.length|0]}
 open(p,it){it.dead=true;p.item=this.roll(p);if(p.bot)setTimeout(()=>this.use(p),600+Math.random()*3000);return p.item}
 // ブロックを避ける：進行方向に壁があれば横へ
}
// ===== CLIENT =====
const $=id=>document.getElementById(id);
const isM=matchMedia('(pointer:coarse)').matches;if(isM)document.body.classList.add('m');
const R=new THREE.WebGLRenderer({antialias:!isM});R.setPixelRatio(Math.min(devicePixelRatio,isM?1.5:2));R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,120);
const amb=new THREE.AmbientLight(0xffffff,.7),sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(10,30,5);scene.add(amb,sun);
const neon=[0x27e6ff,0xff3b7a,0xffd23f,0xa86bff];
let G=null,meshes=[],pm=[],im=new Map(),floor,ring,state='title',me=null,yaw=0,pitch=.35,keys={},joy={x:0,z:0},jumpQ=false,last=0,shownEv=null;
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
function build(){tagEl.forEach(e=>e.remove());tagEl.length=0;while(scene.children.length>2)scene.remove(scene.children[2]);meshes=[];pm=[];im=new Map();
 floor=new THREE.Mesh(new THREE.CircleGeometry(C.ARENA,48).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:TH.fl}));scene.add(floor);
 const g=new THREE.GridHelper(C.ARENA*2,30,TH.ne[0],TH.gr);g.position.y=.01;scene.add(g);
 ring=new THREE.Mesh(new THREE.TorusGeometry(1,.15,6,64).rotateX(Math.PI/2),new THREE.MeshBasicMaterial({color:0xff3b7a}));scene.add(ring);
 G.map.forEach((b,i)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(b.w,b.h,b.d),new THREE.MeshLambertMaterial({color:b.low?TH.lo:TH.b}));m.position.set(b.x,b.h/2,b.z);scene.add(m);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:TH.ne[i%4]}));m.add(e);meshes.push(m)});
 G.P.forEach((p,i)=>{const o=makeChar(i?rndLook():CH);scene.add(o.grp);pm.push(o)})}
const THEMES=[
{n:'CITY NIGHT',fl:0x1a1738,gr:0x2a2560,b:0x2b2a5e,lo:0x6b5bd6,bg:0x0b0a1a,ne:[0x27e6ff,0xff3b7a,0xffd23f,0xa86bff]},
{n:'SCHOOL',fl:0x8a9a72,gr:0x6f7f5a,b:0xe0d2b0,lo:0xb5834f,bg:0x9ec8e8,ne:[0x3b6fd6,0xd64a3b,0x2f9e5b,0xe0a526]},
{n:'AMUSEMENT PARK',fl:0x2a1a4a,gr:0x4a2a7a,b:0x7a3fb0,lo:0xff7ab8,bg:0x1a0b33,ne:[0xff3b7a,0xffd23f,0x27e6ff,0x7aff6b]},
{n:'FACTORY',fl:0x3a3a3f,gr:0x55555c,b:0x66696f,lo:0xc9822b,bg:0x1d1d22,ne:[0xffa31a,0xff4d1a,0xe6e6e6,0xffd23f]},
{n:'SNOW VILLAGE',fl:0xeaf2f8,gr:0xc3d3e0,b:0x8a6a4f,lo:0xcfe3f3,bg:0xbcd6ec,ne:[0xffffff,0x7fb6e6,0xd94a4a,0xffffff]}];
let MODE='TAG',TH=THEMES[0],camMode=0,camD=7;const tagEl=[],rc=new THREE.Raycaster();
let CH={hair:'#8a6cff',skin:'#ffd9c2',skirt:'#1b1838',h:1,tails:1};
try{Object.assign(CH,JSON.parse(localStorage.getItem('chase_ch')||'{}'))}catch(e){}
const pick=a=>a[Math.random()*a.length|0];

 const dir=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)),org=new THREE.Vector3(me.x,hy,me.z);
